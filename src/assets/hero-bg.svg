<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080">
  <defs>
    <!-- Base dark theater gradient -->
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="45%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Glowing screen -->
    <radialGradient id="screenGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#f5f5f5" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#e8e2d6" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#8a1418" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Red projector beams -->
    <linearGradient id="beamRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e50914" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beamWarm" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.92"/>
    </radialGradient>

    <!-- Left side darkening for text readability -->
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.93"/>
      <stop offset="42%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Film strip gradient -->
    <linearGradient id="stripGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="50%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- ============ BASE ============ -->
  <rect width="1920" height="1080" fill="url(#base)"/>

  <!-- ============ GLOWING CINEMA SCREEN (center-right) ============ -->
  <ellipse cx="1240" cy="430" rx="560" ry="360" fill="url(#screenGlow)"/>

  <!-- soft halo behind screen -->
  <g filter="url(#softer)">
    <rect x="880" y="230" width="720" height="410" rx="6" fill="#efe9dc" opacity="0.30"/>
  </g>

  <!-- screen with a cinematic scene playing on it -->
  <g>
    <clipPath id="screenClip">
      <rect x="880" y="230" width="720" height="410" rx="6"/>
    </clipPath>
    <g clip-path="url(#screenClip)">
      <!-- sky -->
      <rect x="880" y="230" width="720" height="410" fill="#1c2230"/>
      <!-- sunset glow -->
      <ellipse cx="1330" cy="470" rx="330" ry="200" fill="#ff7a2f" opacity="0.75"/>
      <ellipse cx="1330" cy="480" rx="180" ry="120" fill="#ffd27a" opacity="0.85"/>
      <!-- distant mountains -->
      <path d="M 880 560 L 1010 440 L 1120 545 L 1230 470 L 1350 570 L 1470 485 L 1600 575 L 1600 640 L 880 640 Z" fill="#0d1017" opacity="0.9"/>
      <path d="M 880 590 L 980 530 L 1090 600 L 1200 545 L 1320 615 L 1450 555 L 1600 620 L 1600 640 L 880 640 Z" fill="#07090d"/>
      <!-- silhouette of a couple watching (bottom center of screen) -->
      <g fill="#040507">
        <circle cx="1180" cy="575" r="17"/>
        <path d="M 1155 640 q 25 -42 50 0 Z"/>
        <circle cx="1230" cy="580" r="15"/>
        <path d="M 1208 640 q 22 -38 44 0 Z"/>
      </g>
      <!-- filmic scanlines -->
      <g fill="#000000" opacity="0.10">
        <rect x="880" y="270" width="720" height="3"/>
        <rect x="880" y="330" width="720" height="3"/>
        <rect x="880" y="390" width="720" height="3"/>
        <rect x="880" y="450" width="720" height="3"/>
        <rect x="880" y="510" width="720" height="3"/>
        <rect x="880" y="570" width="720" height="3"/>
      </g>
      <!-- screen brightness lift -->
      <rect x="880" y="230" width="720" height="410" fill="#ffffff" opacity="0.14"/>
    </g>
    <rect x="880" y="230" width="720" height="410" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="3"/>
  </g>

  <!-- Screen soft cast on floor -->
  <ellipse cx="1240" cy="760" rx="520" ry="130" fill="#ffb86b" opacity="0.10" filter="url(#softer)"/>

  <!-- ============ PROJECTOR BEAMS ============ -->
  <g opacity="0.85">
    <polygon points="1900,60 1900,140 900,520 980,600" fill="url(#beamRed)" filter="url(#soft)"/>
    <polygon points="1900,180 1900,230 1040,560 1100,610" fill="url(#beamWarm)" filter="url(#soft)"/>
    <polygon points="40,40 120,90 900,470 840,540" fill="url(#beamRed)" opacity="0.5" filter="url(#soft)"/>
  </g>

  <!-- ============ FLOATING FILM REELS ============ -->
  <!-- Big reel top-right -->
  <g transform="translate(1620,250)" opacity="0.5" filter="url(#tiny)">
    <circle r="95" fill="none" stroke="#3a3a3a" stroke-width="14"/>
    <circle r="95" fill="none" stroke="#e50914" stroke-opacity="0.5" stroke-width="3"/>
    <circle r="26" fill="#2a2a2a" stroke="#4a4a4a" stroke-width="6"/>
    <g fill="#242424" stroke="#3f3f3f" stroke-width="3">
      <circle cx="0" cy="-58" r="17"/>
      <circle cx="55" cy="-18" r="17"/>
      <circle cx="34" cy="47" r="17"/>
      <circle cx="-34" cy="47" r="17"/>
      <circle cx="-55" cy="-18" r="17"/>
    </g>
    <circle cx="-40" cy="-40" r="4" fill="#e50914" opacity="0.9"/>
  </g>

  <!-- Small reel bottom-right -->
  <g transform="translate(1740,830)" opacity="0.4" filter="url(#tiny)">
    <circle r="60" fill="none" stroke="#333" stroke-width="10"/>
    <circle r="60" fill="none" stroke="#e50914" stroke-opacity="0.45" stroke-width="2.5"/>
    <circle r="17" fill="#242424" stroke="#444" stroke-width="4"/>
    <g fill="#202020" stroke="#3a3a3a" stroke-width="2.5">
      <circle cx="0" cy="-37" r="11"/>
      <circle cx="35" cy="-11" r="11"/>
      <circle cx="21" cy="30" r="11"/>
      <circle cx="-21" cy="30" r="11"/>
      <circle cx="-35" cy="-11" r="11"/>
    </g>
  </g>

  <!-- ============ FILM STRIP RIBBONS ============ -->
  <!-- Ribbon sweeping across upper area -->
  <g opacity="0.55" transform="rotate(-14 1200 140)">
    <rect x="700" y="96" width="1300" height="86" rx="4" fill="url(#stripGrad)" stroke="#3d3d3d" stroke-width="2"/>
    <g fill="#0b0b0b">
      <rect x="726" y="112" width="46" height="26" rx="3"/>
      <rect x="796" y="112" width="46" height="26" rx="3"/>
      <rect x="866" y="112" width="46" height="26" rx="3"/>
      <rect x="936" y="112" width="46" height="26" rx="3"/>
      <rect x="1006" y="112" width="46" height="26" rx="3"/>
      <rect x="1076" y="112" width="46" height="26" rx="3"/>
      <rect x="1146" y="112" width="46" height="26" rx="3"/>
      <rect x="1216" y="112" width="46" height="26" rx="3"/>
      <rect x="1286" y="112" width="46" height="26" rx="3"/>
      <rect x="1356" y="112" width="46" height="26" rx="3"/>
      <rect x="1426" y="112" width="46" height="26" rx="3"/>
      <rect x="1496" y="112" width="46" height="26" rx="3"/>
      <rect x="1566" y="112" width="46" height="26" rx="3"/>
      <rect x="1636" y="112" width="46" height="26" rx="3"/>
      <rect x="1706" y="112" width="46" height="26" rx="3"/>
      <rect x="1776" y="112" width="46" height="26" rx="3"/>
      <rect x="726" y="146" width="46" height="26" rx="3"/>
      <rect x="796" y="146" width="46" height="26" rx="3"/>
      <rect x="866" y="146" width="46" height="26" rx="3"/>
      <rect x="936" y="146" width="46" height="26" rx="3"/>
      <rect x="1006" y="146" width="46" height="26" rx="3"/>
      <rect x="1076" y="146" width="46" height="26" rx="3"/>
      <rect x="1146" y="146" width="46" height="26" rx="3"/>
      <rect x="1216" y="146" width="46" height="26" rx="3"/>
      <rect x="1286" y="146" width="46" height="26" rx="3"/>
      <rect x="1356" y="146" width="46" height="26" rx="3"/>
      <rect x="1426" y="146" width="46" height="26" rx="3"/>
      <rect x="1496" y="146" width="46" height="26" rx="3"/>
      <rect x="1566" y="146" width="46" height="26" rx="3"/>
      <rect x="1636" y="146" width="46" height="26" rx="3"/>
      <rect x="1706" y="146" width="46" height="26" rx="3"/>
      <rect x="1776" y="146" width="46" height="26" rx="3"/>
    </g>
  </g>

  <!-- Ribbon curving near bottom -->
  <g opacity="0.4" transform="rotate(9 1150 930)">
    <rect x="520" y="880" width="1420" height="74" rx="4" fill="url(#stripGrad)" stroke="#3a3a3a" stroke-width="2"/>
    <g fill="#0b0b0b">
      <rect x="546" y="894" width="40" height="22" rx="3"/>
      <rect x="610" y="894" width="40" height="22" rx="3"/>
      <rect x="674" y="894" width="40" height="22" rx="3"/>
      <rect x="738" y="894" width="40" height="22" rx="3"/>
      <rect x="802" y="894" width="40" height="22" rx="3"/>
      <rect x="866" y="894" width="40" height="22" rx="3"/>
      <rect x="930" y="894" width="40" height="22" rx="3"/>
      <rect x="994" y="894" width="40" height="22" rx="3"/>
      <rect x="1058" y="894" width="40" height="22" rx="3"/>
      <rect x="1122" y="894" width="40" height="22" rx="3"/>
      <rect x="1186" y="894" width="40" height="22" rx="3"/>
      <rect x="1250" y="894" width="40" height="22" rx="3"/>
      <rect x="1314" y="894" width="40" height="22" rx="3"/>
      <rect x="1378" y="894" width="40" height="22" rx="3"/>
      <rect x="1442" y="894" width="40" height="22" rx="3"/>
      <rect x="1506" y="894" width="40" height="22" rx="3"/>
      <rect x="1570" y="894" width="40" height="22" rx="3"/>
      <rect x="1634" y="894" width="40" height="22" rx="3"/>
      <rect x="1698" y="894" width="40" height="22" rx="3"/>
      <rect x="1762" y="894" width="40" height="22" rx="3"/>
      <rect x="1826" y="894" width="40" height="22" rx="3"/>
      <rect x="546" y="924" width="40" height="22" rx="3"/>
      <rect x="610" y="924" width="40" height="22" rx="3"/>
      <rect x="674" y="924" width="40" height="22" rx="3"/>
      <rect x="738" y="924" width="40" height="22" rx="3"/>
      <rect x="802" y="924" width="40" height="22" rx="3"/>
      <rect x="866" y="924" width="40" height="22" rx="3"/>
      <rect x="930" y="924" width="40" height="22" rx="3"/>
      <rect x="994" y="924" width="40" height="22" rx="3"/>
      <rect x="1058" y="924" width="40" height="22" rx="3"/>
      <rect x="1122" y="924" width="40" height="22" rx="3"/>
      <rect x="1186" y="924" width="40" height="22" rx="3"/>
      <rect x="1250" y="924" width="40" height="22" rx="3"/>
      <rect x="1314" y="924" width="40" height="22" rx="3"/>
      <rect x="1378" y="924" width="40" height="22" rx="3"/>
      <rect x="1442" y="924" width="40" height="22" rx="3"/>
      <rect x="1506" y="924" width="40" height="22" rx="3"/>
      <rect x="1570" y="924" width="40" height="22" rx="3"/>
      <rect x="1634" y="924" width="40" height="22" rx="3"/>
      <rect x="1698" y="924" width="40" height="22" rx="3"/>
      <rect x="1762" y="924" width="40" height="22" rx="3"/>
      <rect x="1826" y="924" width="40" height="22" rx="3"/>
    </g>
  </g>

  <!-- ============ CINEMA SEATS (bottom silhouette) ============ -->
  <g fill="#070707" opacity="0.95">
    <!-- back row -->
    <g transform="translate(0,905)">
      <g>
        <rect x="-30" y="0" width="150" height="70" rx="18"/>
        <rect x="140" y="0" width="150" height="70" rx="18"/>
        <rect x="310" y="0" width="150" height="70" rx="18"/>
        <rect x="480" y="0" width="150" height="70" rx="18"/>
        <rect x="650" y="0" width="150" height="70" rx="18"/>
        <rect x="820" y="0" width="150" height="70" rx="18"/>
        <rect x="990" y="0" width="150" height="70" rx="18"/>
        <rect x="1160" y="0" width="150" height="70" rx="18"/>
        <rect x="1330" y="0" width="150" height="70" rx="18"/>
        <rect x="1500" y="0" width="150" height="70" rx="18"/>
        <rect x="1670" y="0" width="150" height="70" rx="18"/>
        <rect x="1840" y="0" width="150" height="70" rx="18"/>
      </g>
    </g>
    <!-- front row -->
    <g transform="translate(-60,985)">
      <g>
        <rect x="-40" y="0" width="185" height="95" rx="22"/>
        <rect x="165" y="0" width="185" height="95" rx="22"/>
        <rect x="370" y="0" width="185" height="95" rx="22"/>
        <rect x="575" y="0" width="185" height="95" rx="22"/>
        <rect x="780" y="0" width="185" height="95" rx="22"/>
        <rect x="985" y="0" width="185" height="95" rx="22"/>
        <rect x="1190" y="0" width="185" height="95" rx="22"/>
        <rect x="1395" y="0" width="185" height="95" rx="22"/>
        <rect x="1600" y="0" width="185" height="95" rx="22"/>
        <rect x="1805" y="0" width="185" height="95" rx="22"/>
      </g>
    </g>
  </g>

  <!-- subtle red rim light on seat tops -->
  <g stroke="#e50914" stroke-opacity="0.30" stroke-width="3" fill="none" filter="url(#tiny)">
    <path d="M 400 905 q 40 -14 80 0"/>
    <path d="M 740 905 q 40 -14 80 0"/>
    <path d="M 1080 905 q 40 -14 80 0"/>
    <path d="M 1420 905 q 40 -14 80 0"/>
    <path d="M 340 985 q 48 -16 96 0"/>
    <path d="M 940 985 q 48 -16 96 0"/>
    <path d="M 1540 985 q 48 -16 96 0"/>
  </g>

  <!-- ============ BOKEH / DUST PARTICLES ============ -->
  <g>
    <circle cx="330" cy="210" r="5" fill="#e50914" opacity="0.55" filter="url(#tiny)"/>
    <circle cx="470" cy="330" r="3" fill="#ffffff" opacity="0.35" filter="url(#tiny)"/>
    <circle cx="250" cy="470" r="4" fill="#ffb347" opacity="0.40" filter="url(#tiny)"/>
    <circle cx="600" cy="180" r="3" fill="#ffffff" opacity="0.30" filter="url(#tiny)"/>
    <circle cx="700" cy="620" r="5" fill="#e50914" opacity="0.35" filter="url(#tiny)"/>
    <circle cx="820" cy="740" r="3" fill="#ffffff" opacity="0.25" filter="url(#tiny)"/>
    <circle cx="1500" cy="700" r="4" fill="#ffb347" opacity="0.35" filter="url(#tiny)"/>
    <circle cx="1650" cy="540" r="5" fill="#e50914" opacity="0.40" filter="url(#tiny)"/>
    <circle cx="1810" cy="380" r="3" fill="#ffffff" opacity="0.30" filter="url(#tiny)"/>
    <circle cx="1350" cy="140" r="4" fill="#ffffff" opacity="0.25" filter="url(#tiny)"/>
    <circle cx="980" cy="120" r="3" fill="#e50914" opacity="0.45" filter="url(#tiny)"/>
    <circle cx="1560" cy="880" r="4" fill="#ffffff" opacity="0.22" filter="url(#tiny)"/>
    <circle cx="190" cy="640" r="4" fill="#e50914" opacity="0.35" filter="url(#tiny)"/>
    <circle cx="1120" cy="820" r="3" fill="#ffb347" opacity="0.30" filter="url(#tiny)"/>
  </g>

  <!-- ============ ATMOSPHERIC OVERLAYS ============ -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <rect width="1920" height="1080" fill="url(#leftShade)"/>

  <!-- faint red glow bottom-left accent -->
  <ellipse cx="140" cy="1020" rx="420" ry="240" fill="#e50914" opacity="0.10" filter="url(#softer)"/>
</svg>
